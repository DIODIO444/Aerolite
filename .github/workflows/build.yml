name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace setupCiWorkspace build

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aerolite
          path: build/libs/*.jar
          if-no-files-found: ignore
