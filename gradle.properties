org.gradle.jvmargs=-Xmx3g

# JitPack builds missing artifacts on demand, so the first request for a
# `-SNAPSHOT` dependency can take minutes. Gradle's 30s default socket timeout
# kills that download and the build fails with "Read timed out".
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=2000

mod_version=6.0.0
maven_group=net.ccbluex
archives_base_name=Aerolite

# Kotlin
# https://kotlinlang.org/releases.html
# DO NOT CHANGE THIS UNLESS YOU KNOW WHAT YOU ARE DOING!
kotlin_version=2.0.21
kotlin_coroutines_version=1.10.1

forgegradle_version = f2c5bb338e
mixingradle_version = ae2a80e
